<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - LgsSoruTahmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profil.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 450px;
            margin: 5rem auto;
            background: #fff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .auth-title {
            text-align: center;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>

<body>

    <header class="main-header py-3">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo-area">
                    <img src="/img/txlogo.png" alt="Lgs Soru Tahmin Logo" style="height: 90px; object-fit: contain;">
                </div>
                <div class="auth-area"></div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-navbar">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-center py-2">
                <a href="/index.html" class="nav-link-custom me-5">Anasayfa</a>
                <a href="/tasarim.html" class="nav-link-custom me-5">Sana Özel Sorular</a>
                <a href="/ai.html" class="nav-link-custom me-5">TahminX Ai</a>
                <a href="/gecmis.html" class="nav-link-custom me-5">Soru Geçmişi</a>
                <a href="/profil.html" class="nav-link-custom">Profilim</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2 class="auth-title">Aramıza Katıl 👋</h2>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" class="form-control" id="username" placeholder="Örn: gokceyavuz" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-posta Adresi</label>
                    <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Şifre</label>
                    <input type="password" class="form-control" id="password" placeholder="********" required>
                </div>

                <div id="alertMessage" class="alert d-none mt-3" role="alert"></div>

                <button type="submit" class="btn btn-register">
                    <span id="btnText">Kayıt Ol</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>

            <div class="text-center mt-4 text-muted small">
                Zaten hesabın var mı? <a href="#" class="text-primary text-decoration-none">Giriş Yap</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="kayit.js"></script>
</body>

</html>
