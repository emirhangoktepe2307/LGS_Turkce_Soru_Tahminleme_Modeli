<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LgsSoruTahmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="soru-secim.css">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="main-header py-3">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between align-items-center">
                <!-- Left Side: Logo Area -->
                <div class="logo-area">
                    <img src="/img/txlogo.png" alt="Lgs Soru Tahmin Logo" style="height: 90px; object-fit: contain;">
                </div>

                <!-- Right Side: Auth Area -->
                <div class="auth-area"></div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-navbar">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-center py-2">
                <a href="/index.html" class="nav-link-custom me-5">Anasayfa</a>
                <a href="/tasarim.html" class="nav-link-custom me-5">Sana Özel Sorular</a>
                <a href="/ai.html" class="nav-link-custom me-5">TahminX Ai</a>
                <a href="/gecmis.html" class="nav-link-custom me-5">Soru Geçmişi</a>
                <a href="/profil.html" class="nav-link-custom">Profilim</a>
            </div>
        </div>
    </nav>
    <section class="hero">

        <!-- Büyük arka glow -->
        <div class="hero-glow big"></div>

        <!-- İç parlak glow -->
        <div class="hero-glow inner"></div>

        <div class="hero-content">
            <h1 class="hero-title">
                Soruları Daha <span>Akıllı</span> Üret, Daha <span>Kolay</span> Öğren!
            </h1>
            <p class="hero-subtitle">
                LGS Türkçe Cümlede Anlam ve Paragrafta Anlam sorularını yapay zekâ ile anında oluştur.
            </p>
        </div>

        <!-- panel-container burada -->



        <div class="panel-container">

            <!-- KART / FORM ALANI -->
            <div class="panel-card">

                <!-- SEKME BAŞLIKLARI -->
                <div class="panel-tabs">
                    <button class="panel-tab active" data-type="cumlede">
                        CÜMLEDE ANLAM
                    </button>
                    <button class="panel-tab" data-type="paragrafta">
                        PARAGRAFTA ANLAM
                    </button>
                </div>

                <div class="panel-row">
                    <div class="panel-field">
                        <label class="panel-label">KONU</label>
                        <select id="konuSelect" class="panel-select"></select>
                    </div>

                    <div class="panel-field">
                        <label class="panel-label">YIL</label>
                        <select id="yilSelect" class="panel-select">
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                        </select>
                    </div>
                </div>

                <!-- BUTON ALT SATIRDA -->
                <div class="panel-button-row">
                    <button id="btnSoruOlustur" class="panel-btn">SORULARI GÖR</button>
                </div>

            </div>

            <!-- SORU LİSTESİ SONUALARI -->
            <div id="soruListesi" class="mt-5"></div>
        </div>

    </section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="tabs.js"></script>
    <script src="auth.js"></script>
</body>

</html>
