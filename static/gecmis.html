<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Geçmişi - LgsSoruTahmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="profil.css">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .page-title {
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .btn-meb {
            background-color: #E11D48;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-meb:hover {
            background-color: #BE123C;
            color: white;
            transform: translateY(-1px);
        }

        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px 16px 0 0;
            padding: 1.5rem;
        }

        .question-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .question-badge {
            background-color: #FEF3C7;
            color: #D97706;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <header class="main-header py-3">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between align-items-center">
                <!-- Left Side: Logo Area -->
                <div class="logo-area">
                    <img src="/img/txlogo.png" alt="Lgs Soru Tahmin Logo" style="height: 90px; object-fit: contain;">
                </div>

                <!-- Right Side: Sign Up Button -->
                <div class="auth-area"></div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-navbar">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-center py-2">
                <a href="/index.html" class="nav-link-custom me-5">Anasayfa</a>
                <a href="/tasarim.html" class="nav-link-custom me-5">Sana Özel Sorular</a>
                <a href="/ai.html" class="nav-link-custom me-5">TahminX Ai</a>
                <a href="/gecmis.html" class="nav-link-custom me-5 active">Soru Geçmişi</a>
                <a href="/profil.html" class="nav-link-custom">Profilim</a>
            </div>
        </div>
    </nav>

    <section class="profile-page container mt-5">
        <h2 class="page-title">Soru Çözüm Geçmişi</h2>

        <!-- TABLO -->
        <div class="table-card" style="min-height: 400px;">
            <table class="recent-table">
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Konu</th>
                        <th>Tür</th>
                        <th>Başarı</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>

                <tbody id="historyTableBody">
                    <!-- Javascript ile doldurulacak -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- MEB SORULARI MODAL -->
    <div class="modal fade" id="mebQuestionsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Geçmiş LGS Soruları</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light" id="mebQuestionsBody">
                    <!-- Sorular buraya gelecek -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted">MEB arşivinden benzer sorular taranıyor...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="gecmis.js?v=2"></script>
</body>

</html>
